name: CI

on:
  push:
    branch: [main]
  pull_request:
    branch: [main]

jobs:
  test:
    run on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run application
        run: python app.py
